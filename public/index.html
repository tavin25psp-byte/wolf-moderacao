<script>
  let totalProcessado = 0;

  // 1. Processamento via Formulário (Submit)
  document.getElementById('bulk-form').addEventListener('submit', function(e) {
    e.preventDefault();
    iniciarEnvioMassa();
  });

  // 2. Processamento disparado pelo botão de Denúncias em Massa
  function ativarDenuncias() {
    iniciarEnvioMassa();
  }

  // Função central de disparo em lote
  function iniciarEnvioMassa() {
    const numeroInput = document.getElementById('bulk-number');
    const categoriaSelect = document.getElementById('bulk-reason');
    const quantidadeInput = document.getElementById('bulk-quantity');
    
    const feedbackEl = document.getElementById('bulk-feedback');
    const countEl = document.getElementById('bulk-count');
    const statusEl = document.getElementById('bulk-status');
    const progressEl = document.getElementById('bulk-progress');
    const submitBtn = document.querySelector('.primary');
    const bulkBtn = document.querySelector('.btn-denuncias');

    // Validação dos campos obrigatórios
    if (!numeroInput.value || !categoriaSelect.value) {
      alert('Por favor, informe o número de referência e selecione uma categoria.');
      numeroInput.focus();
      return;
    }

    const numero = numeroInput.value;
    const categoria = categoriaSelect.value;
    const quantidade = parseInt(quantidadeInput.value, 10) || 5;

    // Desativa os botões para evitar múltiplos cliques durante o processo
    submitBtn.disabled = true;
    bulkBtn.disabled = true;

    // Estado inicial do progresso
    statusEl.innerText = 'Enviando...';
    progressEl.value = 0;
    
    let atual = 0;

    // Simula o envio de cada registro com intervalo de tempo (ex: 350ms por item)
    const intervalo = setInterval(() => {
      atual++;
      totalProcessado++;

      // Calcula a porcentagem para a barra <progress>
      const porcentagem = Math.round((atual / quantidade) * 100);
      progressEl.value = porcentagem;

      // Atualiza os textos de feedback e contador na tela
      countEl.innerText = totalProcessado;
      feedbackEl.innerText = `Processando lote: enviando requisição ${atual} de ${quantidade} para ${numero} (${porcentagem}%)...`;

      // Condição de término do lote
      if (atual >= quantidade) {
        clearInterval(intervalo);
        
        // Atualiza status final
        statusEl.innerText = 'Concluído';
        feedbackEl.innerText = `✅ Sucesso! Lote de ${quantidade} denúncias processado para a categoria "${categoria}".`;

        // Reativa os botões
        submitBtn.disabled = false;
        bulkBtn.disabled = false;
      }
    }, 350);
  }
</script>
