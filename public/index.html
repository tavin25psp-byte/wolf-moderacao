<script>
  let totalProcessadoGlobal = 0;

  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('bulk-form');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        executarEnvioWhatsApp();
      });
    }
  });

  function ativarDenuncias() {
    executarEnvioWhatsApp();
  }

  async function executarEnvioWhatsApp() {
    const numeroInput = document.getElementById('bulk-number');
    const categoriaSelect = document.getElementById('bulk-reason');
    const quantidadeInput = document.getElementById('bulk-quantity');
    
    const feedbackEl = document.getElementById('bulk-feedback');
    const countEl = document.getElementById('bulk-count');
    const statusEl = document.getElementById('bulk-status');
    const progressEl = document.getElementById('bulk-progress');
    const submitBtn = document.querySelector('.primary');
    const bulkBtn = document.querySelector('.btn-denuncias');

    if (!numeroInput || !numeroInput.value.trim()) {
      alert('Por favor, informe o número de referência.');
      if (numeroInput) numeroInput.focus();
      return;
    }

    if (!categoriaSelect || !categoriaSelect.value) {
      alert('Por favor, selecione uma categoria.');
      if (categoriaSelect) categoriaSelect.focus();
      return;
    }

    const numero = numeroInput.value.trim();
    const categoria = categoriaSelect.value;
    const quantidade = parseInt(quantidadeInput.value, 10) || 5;

    if (submitBtn) submitBtn.disabled = true;
    if (bulkBtn) bulkBtn.disabled = true;

    if (statusEl) statusEl.innerText = 'Enviando...';
    if (feedbackEl) {
      feedbackEl.className = 'feedback';
      feedbackEl.innerText = 'Transmitindo lote para o servidor...';
    }
    if (progressEl) progressEl.value = 0;

    try {
      // Envia os dados para a API no Render
      const resposta = await fetch('https://wolf-moderacao.onrender.com/api/denuncias', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero, categoria, quantidade })
      });

      const resultado = await resposta.json();

      if (!resposta.ok || !resultado.sucesso) {
        throw new Error(resultado.mensagem || 'Erro ao processar na API.');
      }

      if (statusEl) statusEl.innerText = 'Disparando';
      let atual = 0;

      // Como o servidor aceitou o Job, simulamos a abertura dos links no cliente 
      // baseada na quantidade solicitada, garantindo a abertura dos chats do WhatsApp.
      const intervalo = setInterval(() => {
        if (atual < quantidade) {
          atual++;
          totalProcessadoGlobal++;

          const porcentagem = Math.round((atual / quantidade) * 100);
          
          if (progressEl) progressEl.value = porcentagem;
          if (countEl) countEl.innerText = totalProcessadoGlobal;
          if (feedbackEl) {
            feedbackEl.className = 'feedback success';
            feedbackEl.innerText = `Abrindo aba ${atual} de ${quantidade} para o WhatsApp...`;
          }

          // Formata o link oficial do WhatsApp click-to-chat
          const textoMsg = encodeURIComponent(`Denúncia por violação: ${categoria}`);
          const urlWhatsApp = `https://wa.me/${numero}?text=${textoMsg}`;
          
          // Abre a aba do WhatsApp
          window.open(urlWhatsApp, '_blank');

        } else {
          clearInterval(intervalo);
          
          if (statusEl) statusEl.innerText = 'Concluído';
          if (feedbackEl) {
            feedbackEl.className = 'feedback success';
            feedbackEl.innerText = `✅ Sucesso! Lote de ${quantidade} disparos processado com Job ID: ${resultado.jobId}`;
          }

          if (submitBtn) submitBtn.disabled = false;
          if (bulkBtn) bulkBtn.disabled = false;
        }
      }, 700); // 700ms de intervalo entre as abas

    } catch (erro) {
      if (statusEl) statusEl.innerText = 'Erro';
      if (feedbackEl) {
        feedbackEl.className = 'feedback error';
        feedbackEl.innerText = `❌ Falha: ${erro.message}`;
      }
      if (submitBtn) submitBtn.disabled = false;
      if (bulkBtn) bulkBtn.disabled = false;
    }
  }
</script>
